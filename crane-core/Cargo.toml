[package]
name = "crane-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Micro-benchmark for the fused GDN recurrence kernel. No `required-features`:
# it needs `cuda` OR `rocm`, and that field is an AND — the binary itself
# refuses to run when neither is on.
[[bin]]
name = "gdn_bench"

# Micro-benchmark for the GPU top-k kernel. Same `required-features` caveat.
[[bin]]
name = "topk_bench"

# G2P hot-path performance benchmark (text_to_ipa, IpaNormalizer::normalize).
[[bench]]
name = "g2p"
harness = false
required-features = ["onnx"]

[dependencies]
ahash = "0.8"
anyhow = "1.0.97"

# Candle backend variants — see `src/candle_backend.rs`.
candle-nn-upstream = { workspace = true }
# TODO(candle-transformers-removal): See CANDLE_TRANSFORMERS.md for the
# remaining model/component and generation-helper call sites.
candle-transformers-upstream = { workspace = true }

candle-core-sycl = { workspace = true, optional = true }
candle-nn-sycl = { workspace = true, optional = true }
candle-transformers-sycl = { workspace = true, optional = true }

candle-core-rocm = { workspace = true, optional = true }
candle-nn-rocm = { workspace = true, optional = true }
candle-transformers-rocm = { workspace = true, optional = true }
clap = { version = "4.5.32", features = ["derive"] }
hf-hub = { version = "1.0", features = ["blocking"] }
minijinja = { version = "2.21", features = ["builtins", "preserve_order"] }
minijinja-contrib = { version = "2.21", features = ["pycompat"] }
serde = "1.0"
# preserve_order: JSON object keys keep insertion order (matches Python's
# json.dumps / HF chat templates — needed for byte-identical tool rendering).
serde_json = { version = "1.0.140", features = ["preserve_order"] }
tokenizers = { workspace = true }
ribo = "0.1.3"
base64 = "0.23"
fancy-regex = "0.19"
tekken = { version = "0.2.0", default-features = false }
zip = "8"
fst = { workspace = true }
lru = { version = "0.18", optional = true }
memmap2 = "0.9"
aho-corasick = { version = "1", optional = true }
unicode-normalization = { version = "0.1", optional = true }


intel-mkl-src = { version = "0.8.1", optional = true }
accelerate-src = { version = "0.3.2", optional = true }
rustfft = "6"
image = "0.25"
half = "2"
prost = { version = "0.14.3", optional = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
candle-core-upstream = { workspace = true, features = ["metal"] }
candle-nn-upstream = { workspace = true, features = ["metal"] }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
candle-core-upstream = { workspace = true, features = ["accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core-upstream = { workspace = true }

[features]
metal = [
    "candle-core-upstream/metal",
    "candle-nn-upstream/metal",
    "candle-transformers-upstream/metal",
]
cuda = [
    "candle-core-upstream/cuda",
    "candle-nn-upstream/cuda",
    "candle-transformers-upstream/cuda",
    "dep:bindgen_cuda",
]
cudnn = ["candle-core-upstream/cudnn"]
# AMD ROCm/HIP backend (experimental fork). Also enables the fork's own
# `rocm` feature — it's off by default there too.
rocm = [
    "dep:candle-core-rocm",
    "dep:candle-nn-rocm",
    "dep:candle-transformers-rocm",
    "candle-core-rocm/rocm",
    "candle-nn-rocm/rocm",
    "candle-transformers-rocm/rocm",
]
# Intel oneAPI/SYCL backend (experimental fork). Same deal as `rocm` above.
sycl = [
    "dep:candle-core-sycl",
    "dep:candle-nn-sycl",
    "dep:candle-transformers-sycl",
    "candle-core-sycl/sycl",
    "candle-nn-sycl/sycl",
    "candle-transformers-sycl/sycl",
]
mkl = [
    "dep:intel-mkl-src",
    "candle-core-upstream/mkl",
    "candle-nn-upstream/mkl",
    "candle-transformers-upstream/mkl",
]
accelerate = [
    "dep:accelerate-src",
    "candle-core-upstream/accelerate",
    "candle-nn-upstream/accelerate",
    "candle-transformers-upstream/accelerate",
]
onnx = ["dep:prost", "dep:prost-build", "dep:lru", "dep:aho-corasick", "dep:unicode-normalization"]
[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
hound = "3"

[build-dependencies]
bindgen_cuda = { version = "0.1.6", optional = true }
prost-build = { version = "0.14.3", optional = true }
